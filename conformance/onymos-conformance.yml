domain_standard:
  applicable: false
  note: >-
    REWARD-ONLY CHECK, DELIBERATELY LEFT EMPTY. Onymos sells horizontal application components
    (auth, chat, storage, notifications, geofencing, media, payments) plus document-image enhancement.
    Its published contract declares no domain-standard signature — no HL7v2/FHIR resource, no X12 or
    ISO 20022 message type, no SCIM URN, no OData $metadata, no OpenRTB, no LTI/OneRoster, no OAI-PMH
    verb. Its healthcare positioning is a customer segment, not a wire format: DocEnhance moves base64
    JPEGs, not clinical documents in a standard envelope. No conformance is invented to fill this slot.
  probed_for:
  - fhir
  - hl7v2
  - x12
  - iso-20022
  - scim
  - odata
  - openrtb
  - lti
