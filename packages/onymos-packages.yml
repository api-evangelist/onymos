official_package_count: 0
note: >-
  Onymos publishes NO first-party client library to any public package registry. This is a deliberate
  distribution model, not an oversight: Onymos sells "Features-as-a-Service" components that are
  delivered under a commercial licence and installed into the customer's own repository — the FAQ states
  "We even offer to license the actual source code to our customers", and the enterprise licence page
  redirects into the Terms of Service. There is therefore no public `npm install` / `pip install` line to
  record for any Onymos Feature, and consequently NO `SDKs` pointer is emitted in apis.yml: an SDK a
  developer cannot obtain without a sales conversation is not a published SDK. The languages and
  frameworks Onymos says it ships for (React, Angular, Ionic, Cordova, React Native, Flutter, Swift,
  Kotlin, Java, JavaScript/TypeScript, Python, Go) are claimed on the Frameworks page but not backed by
  any registry artifact we could fetch.
