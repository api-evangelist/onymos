apis:
- name: Onymos DocEnhance API
  description: Asynchronous document-image enhancement REST API. POST /api/enhance accepts a base64-encoded image
    plus a preset (document, auto-crop, photo or watermark) and returns a result_url immediately; GET /api/enhance/results/{UUID}
    collects the enhanced image as a base64 data URI. Presets remove shadows, wrinkles, speckle noise and non-solid
    watermarks, auto-crop and deskew, and convert to black and white to raise OCR accuracy and human-in-the-loop
    verification. Requests are authorised with an onymosIesAuthToken request header. This is the only network API
    Onymos documents publicly; every other Onymos Feature is consumed as an in-process SDK object.
  humanURL: https://onymos.com/api/onymos-docenhance-endpoints/
  x-baseURL-status: not-published
  x-baseURL-note: 'Onymos does not state a base host anywhere in the DocEnhance endpoint reference. The only host
    evidence available is indirect and unusable as a base: the published example result_url is the path "/ies/api/enhance/results/{UUID}"
    (note the /ies prefix the reference never explains), and api.onymos.com resolves via CNAME to onymosapiloadbalancer-154243126.us-west-2.elb.amazonaws.com
    but returned HTTP 503 with an empty body on every path probed on 2026-08-26, including /ies/api/enhance. Recording
    baseURL as missing rather than guessing api.onymos.com from the domain, per the enrichment contract.'
  tags:
