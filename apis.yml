aid: onymos
name: Onymos
description: 'Onymos is a Menlo Park, California software company that sells "Features-as-a-Service" (FaaS) — pre-built,
  pro-code application components that enterprise engineering teams drop into their own web, mobile and IoT apps
  instead of building commodity functionality from scratch. The catalog spans Access (social/OAuth 2.0 login), Biometrics,
  Chat, Contacts, DataStore, DeepLink, Location/geofencing, Media, Notification, Payments, Share, and a document-intelligence
  family — DocEnhance (image enhancement and OCR pre-processing), DocID (client-side document classification) and
  DocKnow (intelligent document processing). Onymos is built on a "No-Data Architecture": the software runs inside
  the customer''s own cloud or on-premises environment and Onymos never stores, sees, or accesses customer data,
  and customers may license the source code outright. Developers consume the features through JavaScript/TypeScript
  SDK objects (OnymosAccess, OnymosChat, OnymosUtil, OnymosPayment, OnymosDocID and siblings) across React, Angular,
  Ionic, Cordova, React Native, Flutter, Swift, Kotlin, Java, Python and Go. DocEnhance additionally exposes a documented
  asynchronous REST surface. Onymos states it is SOC 2 certified and HIPAA compliant, and it concentrates on healthcare,
  life sciences and laboratory workflows.'
