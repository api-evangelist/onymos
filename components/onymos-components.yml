  client-side components ("Features-as-a-Service"): the customer installs a licensed component into their
  own app and calls it through a JavaScript/TypeScript object. Each entry below lists the exact method
  names published on the Feature's own reference page — every name here was read off a page we fetched,
  none was inferred. Distribution is licence-gated, so none of these components resolves to a public
  package (see packages/onymos-packages.yml).
